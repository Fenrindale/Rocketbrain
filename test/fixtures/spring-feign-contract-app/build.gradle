plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'fixture'
version = '1.0.0'
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += '-parameters' }
