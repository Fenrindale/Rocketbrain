spring.application.name=rocketbrain-spring-jpa-fixture
server.address=127.0.0.1
server.port=0
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.session_factory.statement_inspector=fixture.boot.SqlCapture
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
management.endpoints.web.exposure.include=health,info,beans,conditions,configprops,env,mappings
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
fixture.dynamic.enabled=true
fixture.credentials.password=fixture-only-secret-sentinel
fixture.credentials.api-key=fixture-only-api-key-sentinel
logging.level.org.hibernate.SQL=OFF
