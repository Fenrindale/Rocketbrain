plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}
group = 'fixture'
version = '0.9.0'
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testng:testng:7.11.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.incremental = false; options.compilerArgs += '-parameters' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.register('writeTestClasspath') {
    dependsOn testClasses
    doLast {
        layout.buildDirectory.file('test-runtime-classpath.txt').get().asFile.text = sourceSets.test.runtimeClasspath.asPath
        def artifacts = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [group: it.moduleVersion.id.group, name: it.name, version: it.moduleVersion.id.version, file: it.file.absolutePath]
        }
        layout.buildDirectory.file('test-dependencies.json').get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts))
    }
}
tasks.register('writeClasspath') {
    dependsOn classes
    doLast {
        def output = layout.buildDirectory.file('runtime-classpath.txt').get().asFile
        output.text = sourceSets.main.runtimeClasspath.asPath
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [group: it.moduleVersion.id.group, name: it.name, version: it.moduleVersion.id.version, file: it.file.absolutePath]
        }
        layout.buildDirectory.file('dependencies.json').get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts))
    }
}
