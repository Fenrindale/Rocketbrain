plugins { id 'java' }

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    modularity.inferModulePath = true
}

dependencies {
    implementation 'org.springframework:spring-jdbc:7.0.10'
    testImplementation 'org.testng:testng:7.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'org.jcommander:jcommander:1.83'
    testRuntimeOnly 'com.mysql:mysql-connector-j:9.7.0'
    testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
}

tasks.register('writeTestModulePath') {
    dependsOn tasks.compileTestJava
    doLast {
        layout.buildDirectory.file('jpms-test-path.txt').get().asFile.text =
            configurations.testRuntimeClasspath.files.collect { it.absolutePath }.join(System.lineSeparator())
    }
}
