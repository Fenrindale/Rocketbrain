micronaut.application.name=micronaut-native-linux
datasources.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
datasources.mysql.url=${RB_NATIVE_MYSQL_URL}
datasources.mysql.username=${RB_NATIVE_DB_USER}
datasources.mysql.password=${RB_NATIVE_DB_PASSWORD}
datasources.mysql.initialization-fail-timeout=-1
datasources.mysql.minimum-idle=0
datasources.mysql.connection-timeout=2500
datasources.mariadb.driver-class-name=org.mariadb.jdbc.Driver
datasources.mariadb.url=${RB_NATIVE_MARIADB_URL}
datasources.mariadb.username=${RB_NATIVE_DB_USER}
datasources.mariadb.password=${RB_NATIVE_DB_PASSWORD}
datasources.mariadb.initialization-fail-timeout=-1
datasources.mariadb.minimum-idle=0
datasources.mariadb.connection-timeout=2500
