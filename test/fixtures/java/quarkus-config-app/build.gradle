plugins {
    id 'java'
    id 'io.quarkus' version '3.40.1.2'
}
group = 'quarkusconfigfixture'
version = '1.0.0'
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.40.1.2')
    implementation 'io.quarkus:quarkus-rest'
    runtimeOnly 'com.mysql:mysql-connector-j:9.7.0'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += '-parameters' }
