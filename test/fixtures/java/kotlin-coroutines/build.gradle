plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'application'
}

repositories { mavenCentral() }

kotlin { jvmToolchain(25) }

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    compileOnly 'org.springframework:spring-jdbc:7.0.10'
    runtimeOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-debug:1.11.0'
}

application { mainClass = 'coroutinesfixture.MainKt' }
