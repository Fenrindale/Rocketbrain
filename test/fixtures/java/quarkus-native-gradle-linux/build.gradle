plugins {
    id 'java'
    id 'io.quarkus' version '3.40.1.2'
}

group = 'rocketbrain.fixture'
version = '1.0.0'
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.40.1.2')
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-agroal'
    implementation 'io.quarkus:quarkus-jdbc-mysql'
    implementation 'io.quarkus:quarkus-jdbc-mariadb'
}
