plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'org.jetbrains.compose' version '1.12.2'
}

repositories {
    mavenCentral()
    google()
}

def previewTarget = providers.gradleProperty('fixtureJvmTarget').orElse('desktop').get()
kotlin {
    jvmToolchain(25)
    jvm(previewTarget)
    sourceSets {
        commonMain {
            dependencies {
                implementation(compose.runtime)
                implementation(compose.foundation)
                implementation('org.jetbrains.compose.ui:ui-tooling-preview:1.12.2')
            }
        }
        getByName(previewTarget + 'Main') {
            kotlin.srcDir('src/workstation/kotlin')
            resources.srcDir('src/workstation/assets')
            dependencies { implementation(compose.desktop.currentOs) }
        }
    }
}
