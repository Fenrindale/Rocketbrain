name: Dev Container runtime

on:
  workflow_dispatch:
  push:
    branches: [main, 'verify-devcontainer-*']
    paths:
      - '.github/workflows/devcontainer-runtime.yml'
      - 'src/devcontainer/**'
      - 'test/devcontainer.test.js'
      - 'test/devcontainer-port-fixture.js'
      - 'test/devcontainer-attach-fixture.js'
      - 'test/devcontainer-attach.test.js'
      - 'test/fixtures/devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/devcontainer-runtime.yml'
      - 'src/devcontainer/**'
      - 'test/devcontainer.test.js'
      - 'test/devcontainer-port-fixture.js'
      - 'test/devcontainer-attach-fixture.js'
      - 'test/devcontainer-attach.test.js'
      - 'test/fixtures/devcontainer/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  docker-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked project dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the locked specification CLI
        run: npm ci --prefix test/fixtures/devcontainer/tooling --ignore-scripts --no-audit --no-fund
      - name: Verify image, Dockerfile, Compose, HTTP and JDWP lifecycles with real Docker
        env:
          ROCKETBRAIN_DEVCONTAINER_LIVE: 'true'
          ROCKETBRAIN_DEVCONTAINER_CLI_PATH: ${{ github.workspace }}/test/fixtures/devcontainer/tooling/node_modules/@devcontainers/cli
          ROCKETBRAIN_DEVCONTAINER_RECEIPT: ${{ runner.temp }}/rocketbrain-devcontainer-receipt.json
        run: node --test test/devcontainer.test.js test/devcontainer-attach.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-devcontainer-runtime
          path: ${{ runner.temp }}/rocketbrain-devcontainer-receipt.json
          if-no-files-found: error
          retention-days: 7
