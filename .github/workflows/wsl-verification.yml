name: WSL workspace runtime

on:
  push:
    branches: ['verify-wsl-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl1:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [workbench, java-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        if: matrix.scenario == 'java-debug'
        with:
          distribution: temurin
          java-version: '25'
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check the candidate VSIX
        shell: pwsh
        run: |
          node --test test/wsl-workspace.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/package.js
      - name: Verify packaged Windows-drive and Linux-owned projects against real WSL 1
        shell: pwsh
        env:
          ROCKETBRAIN_WSL_SCENARIO: ${{ matrix.scenario }}
        run: |
          if ($env:ROCKETBRAIN_WSL_SCENARIO -ceq 'java-debug') {
            ./scripts/test-wsl-runtime.ps1 -VerifyJavaDebug
          } else {
            ./scripts/test-wsl-runtime.ps1 -VerifyWorkbench
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-wsl-${{ matrix.scenario }}
          path: ${{ runner.temp }}/rocketbrain-wsl-runtime.json
          if-no-files-found: error
          retention-days: 7
