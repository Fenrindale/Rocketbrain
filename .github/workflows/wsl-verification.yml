name: WSL workspace runtime

on:
  push:
    branches: ['verify-wsl-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl1:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owned WSL 1 distribution and local workspace mapping
        shell: pwsh
        run: ./scripts/test-wsl-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-wsl-runtime
          path: ${{ runner.temp }}/rocketbrain-wsl-runtime.json
          if-no-files-found: error
          retention-days: 7
