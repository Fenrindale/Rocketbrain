name: WSL workspace runtime

on:
  push:
    branches: ['verify-wsl-db-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl2:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check the candidate VSIX
        shell: pwsh
        run: |
          node --test test/wsl-workspace.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/package.js
      - name: Verify packaged projects against real WSL 2
        shell: pwsh
        env:
          ROCKETBRAIN_WSL_DB_ENGINE: ${{ matrix.database }}
        run: ./scripts/test-wsl-runtime.ps1 -WslVersion 2 -VerifyJavaDebug -Database $env:ROCKETBRAIN_WSL_DB_ENGINE
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-wsl2-${{ matrix.database }}
          path: ${{ runner.temp }}/rocketbrain-wsl-runtime.json
          if-no-files-found: error
          retention-days: 7
