name: Kubernetes explorer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kubernetes-explorer.yml'
      - 'src/infra/kubernetes*.js'
      - 'scripts/test-kubernetes-kind.js'
      - 'test/fixtures/kubernetes-explorer/**'
  pull_request:
    paths:
      - '.github/workflows/kubernetes-explorer.yml'
      - 'src/infra/kubernetes*.js'
      - 'scripts/test-kubernetes-kind.js'
      - 'test/fixtures/kubernetes-explorer/**'

permissions:
  contents: read

jobs:
  kind:
    name: Kubernetes explorer and reviewed Deployment scale on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned CLI binaries
        shell: bash
        run: |
          set -euo pipefail
          bin="$(mktemp -d "$RUNNER_TEMP/rb-kube-bin-XXXXXX")"
          cd "$bin"
          download() {
            curl --proto '=https' --tlsv1.2 --retry 2 --fail --silent --show-error --location "$1" -o "$2"
            printf '%s  %s\n' "$3" "$2" | sha256sum --check
          }
          download https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 kind aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          download https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl kubectl 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
          download https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz helm.tar.gz d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
          tar -xzf helm.tar.gz --strip-components 1 linux-amd64/helm
          chmod +x kind kubectl helm
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: Verify the explorer against a disposable local cluster
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          owned="$(mktemp -d "$RUNNER_TEMP/rb-kube-fixture-XXXXXX")"
          name=rocketbrain-explorer
          admin="$owned/admin.kubeconfig"
          trap 'kind delete cluster --name "$name"; rm -f -- "$admin"; rmdir -- "$owned"' EXIT
          kind create cluster --name "$name" --kubeconfig "$admin" --wait 180s \
            --image 'kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed'
          kubectl --kubeconfig "$admin" --context "kind-$name" apply -f test/fixtures/kubernetes-explorer/access.yml
          helm upgrade --install rocketbrain-fixture test/fixtures/kubernetes-explorer/chart \
            --kubeconfig "$admin" --kube-context "kind-$name" --namespace rocketbrain-observed --wait --timeout 120s
          export ROCKETBRAIN_KUBE_ADMIN_CONFIG="$admin" ROCKETBRAIN_KUBE_KIND_NAME="$name"
          export ROCKETBRAIN_KUBECTL="$(command -v kubectl)" ROCKETBRAIN_HELM="$(command -v helm)"
          node scripts/test-kubernetes-kind.js | tee "$RUNNER_TEMP/rocketbrain-kube-actions.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-kube-actions
          path: ${{ runner.temp }}/rocketbrain-kube-actions.json
          if-no-files-found: error
          retention-days: 7
