name: Linux Java debugger ownership

on:
  workflow_dispatch:
  push:
    branches: [main, 'verify-linux-java-*']
    paths:
      - '.github/workflows/linux-java-debug.yml'
      - 'src/java/*debug*.js'
      - 'test/java-debug-processes-linux.test.js'
      - 'test/helpers/java-debug-process-fixture.js'
  pull_request:
    paths:
      - '.github/workflows/linux-java-debug.yml'
      - 'src/java/*debug*.js'
      - 'test/java-debug-processes-linux.test.js'
      - 'test/helpers/java-debug-process-fixture.js'

permissions:
  contents: read

jobs:
  listener-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify owned HotSpot listener and JDI attachment
        env:
          ROCKETBRAIN_LINUX_JVM_TEST: '1'
          ROCKETBRAIN_LINUX_JVM_RECEIPT: ${{ runner.temp }}/rocketbrain-linux-jvm.json
        run: node --test test/java-debug-processes-linux.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-linux-jvm
          path: ${{ runner.temp }}/rocketbrain-linux-jvm.json
          if-no-files-found: error
          retention-days: 7
