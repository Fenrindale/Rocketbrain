name: Kotlin iOS Simulator debug

on:
  workflow_dispatch:
  push:
    branches: ['verify-kotlin-ios-*']
    paths:
      - '.github/workflows/kotlin-ios-simulator-debug.yml'
      - 'src/java/kmp-ios-*.js'
      - 'runtime/ios-debug/simulator_lldb.py'
      - 'test/kmp-ios-debug.test.js'
      - 'test/fixtures/kotlin-ios-debug/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 27
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10.29.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Verify actual Apple toolchain and available simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/rocketbrain-ios-xcode.txt"
          grep -Fx 'Xcode 26.4.1' "$RUNNER_TEMP/rocketbrain-ios-xcode.txt"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.4
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/rocketbrain-ios-runtimes.json"
          node - "$RUNNER_TEMP/rocketbrain-ios-runtimes.json" <<'JS'
          const runtimes = require(process.argv[2]).runtimes;
          const runtime = runtimes.find(item => item.identifier === 'com.apple.CoreSimulator.SimRuntime.iOS-26-4');
          if (!runtime?.isAvailable) throw Error('Expected installed iOS 26.4 runtime');
          console.log(runtime.identifier, runtime.version, runtime.buildversion);
          JS
          xcrun lldb --version
          printf 'input\n' | xcrun lldb --no-lldbinit --batch -o 'script import os; os.write(1, b"stdin-received=" + os.read(0, 32))' \
            | grep -Fx 'stdin-received=input'
      - name: Build reviewed Kotlin framework and UIKit simulator app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://downloads.gradle.org/distributions/gradle-9.1.0-bin.zip' -o "$RUNNER_TEMP/rocketbrain-gradle.zip"
          printf '%s  %s\n' 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806' \
            "$RUNNER_TEMP/rocketbrain-gradle.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/rocketbrain-gradle.zip" -d "$RUNNER_TEMP/rocketbrain-gradle"
          "$RUNNER_TEMP/rocketbrain-gradle/gradle-9.1.0/bin/gradle" --no-daemon --console=plain --max-workers 2 \
            -p test/fixtures/kotlin-ios-debug linkDebugFrameworkIosSimulatorArm64
          bash test/fixtures/kotlin-ios-debug/build-app.sh "$PWD/test-output/owned-ios-fixture"
      - name: Observe actual Kotlin breakpoint, resume and delete only the owned simulator
        env:
          ROCKETBRAIN_IOS_SIMULATOR_TEST: '1'
          ROCKETBRAIN_IOS_SIMULATOR_RECEIPT: ${{ runner.temp }}/rocketbrain-kotlin-ios-debug.json
        run: node --test test/kmp-ios-debug.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rocketbrain-kotlin-ios-debug
          if-no-files-found: error
          path: ${{ runner.temp }}/rocketbrain-kotlin-ios-debug.json
