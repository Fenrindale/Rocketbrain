name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests-and-package:
    name: Offline tests and VSIX (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Audit public tracked source
        run: node scripts/publication-audit.js --tracked
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run offline tests (external-runtime tests may skip)
        run: node scripts/test-offline.js
      - name: Build and verify local VSIX
        run: pnpm run package
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbrain-development-preview
          path: rocketbrain-*.vsix
          if-no-files-found: error
          retention-days: 7
